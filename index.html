<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi Ana 💕</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    color: #fff;
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    position: relative;
    overflow: hidden;
  }

  #welcome {
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1, #6dd5ed);
    background-size: 400% 400%;
    animation: gradient 10s ease infinite;
  }

  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .welcome-card {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,.18);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 30px;
    padding: 55px 35px;
    max-width: 650px;
    box-shadow: 0 20px 60px rgba(0,0,0,.18);
  }

  h1 {
    font-size: clamp(2.8rem, 8vw, 5.5rem);
    margin: 0 0 15px;
  }

  .welcome-card p {
    font-size: clamp(1.2rem, 3vw, 1.7rem);
    margin: 10px 0;
  }

  .enter-btn {
    margin-top: 30px;
    border: none;
    padding: 17px 34px;
    border-radius: 999px;
    background: white;
    color: #e94f88;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,.2);
    transition: transform .2s, box-shadow .2s;
  }

  .enter-btn:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
  }

  #birthday {
    display: none;
    background: linear-gradient(135deg, #fff0f5, #f4edff, #e5f9ff);
    color: #4b315d;
    min-height: 100vh;
  }

  .birthday-content {
    width: min(1050px, 100%);
    position: relative;
    z-index: 2;
  }

  .birthday-content h2 {
    font-size: clamp(2.3rem, 6vw, 4rem);
    margin: 0 0 8px;
    color: #d94f87;
  }

  .subtitle {
    font-size: 1.2rem;
    margin-bottom: 35px;
  }

  .boxes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .box {
    min-height: 180px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    padding: 25px;
    font-size: 3.5rem;
    box-shadow: 0 12px 30px rgba(70,40,80,.15);
    transition: transform .25s, box-shadow .25s;
    color: white;
  }

  .box:nth-child(1) { background: #ff8fab; }
  .box:nth-child(2) { background: #9b8afb; }
  .box:nth-child(3) { background: #5cc8d7; }
  .box:nth-child(4) { background: #ffb86b; }
  .box:nth-child(5) { background: #7acb8a; }
  .box:nth-child(6) { background: #e87cc0; }

  .box:hover {
    transform: translateY(-8px) rotate(1deg);
    box-shadow: 0 20px 40px rgba(70,40,80,.2);
  }

  .box small {
    display: block;
    font-size: 1rem;
    margin-top: 12px;
    font-weight: bold;
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(40,20,50,.55);
    backdrop-filter: blur(6px);
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 25px;
  }

  .modal-card {
    background: white;
    color: #4b315d;
    max-width: 600px;
    width: 100%;
    border-radius: 30px;
    padding: 45px 30px;
    position: relative;
    animation: pop .3s ease;
    box-shadow: 0 25px 70px rgba(0,0,0,.3);
  }

  @keyframes pop {
    from { transform: scale(.75); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-card .emoji {
    font-size: 4rem;
  }

  .modal-card h3 {
    font-size: 2rem;
    color: #d94f87;
    margin: 15px 0;
  }

  .modal-card p {
    font-size: 1.2rem;
    line-height: 1.7;
  }

  .close {
    position: absolute;
    top: 15px;
    right: 20px;
    border: none;
    background: #f3eaf4;
    color: #6b4c72;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.3rem;
  }

  .confetti {
    position: absolute;
    width: 10px;
    height: 18px;
    top: -30px;
    animation: fall linear forwards;
    opacity: .85;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }

  .floating {
    position: absolute;
    font-size: 2rem;
    opacity: .6;
    animation: float 5s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
  }

  @media (max-width: 700px) {
    .boxes { grid-template-columns: repeat(2, 1fr); }
    .box { min-height: 150px; }
  }

  @media (max-width: 450px) {
    .boxes { grid-template-columns: 1fr 1fr; gap: 12px; }
    .box { min-height: 130px; padding: 15px; font-size: 2.8rem; }
  }
</style>
</head>

<body>

<section id="welcome" class="page">
  <div class="floating" style="left:8%;top:15%">💗</div>
  <div class="floating" style="right:10%;top:20%;animation-delay:1s">✨</div>
  <div class="floating" style="left:15%;bottom:15%;animation-delay:2s">🎈</div>
  <div class="floating" style="right:15%;bottom:12%;animation-delay:3s">🌸</div>

  <div class="welcome-card">
    <div style="font-size:4rem">🎂</div>
    <h1>Hi Ana! 💕</h1>
    <p>Welcome to your birthday week!</p>
    <p>Something special is waiting for you...</p>
    <button class="enter-btn" onclick="enterBirthday()">
      Click here to enter ✨
    </button>
  </div>
</section>

<section id="birthday" class="page">
  <div class="birthday-content">
    <h2>Happy Birthday Week, Ana! 🎉</h2>
    <div class="subtitle">You have 6 little surprises waiting for you 💕</div>

    <div class="boxes">
      <button class="box" onclick="openBox(0)">💌<small>Open me</small></button>
      <button class="box" onclick="openBox(1)">🎂<small>Open me</small></button>
      <button class="box" onclick="openBox(2)">🌸<small>Open me</small></button>
      <button class="box" onclick="openBox(3)">✨<small>Open me</small></button>
      <button class="box" onclick="openBox(4)">🎵<small>Open me</small></button>
      <button class="box" onclick="openBox(5)">🥂<small>Open me</small></button>
    </div>
  </div>
</section>

<div id="modal" class="modal" onclick="closeOutside(event)">
  <div class="modal-card">
    <button class="close" onclick="closeModal()">×</button>
    <div class="emoji" id="modalEmoji"></div>
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
  </div>
</div>

<script>
const messages = [
  {
    emoji: "💌",
    title: "A little message for you",
    text: "Ana, I hope this birthday week reminds you just how loved, appreciated and special you are. You deserve all the happiness in the world. 💕"
  },
  {
    emoji: "🎂",
    title: "Birthday rule #1",
    text: "You are officially allowed to eat as much cake as you want this week. There are no rules. I don't make the rules. 🎂😌"
  },
  {
    emoji: "🌸",
    title: "Something beautiful",
    text: "May this next year bring you beautiful surprises, exciting adventures, peaceful moments and lots of reasons to smile. 🌸✨"
  },
  {
    emoji: "✨",
    title: "Your birthday wish",
    text: "Close your eyes, make a wish, and remember: this is only the beginning of another amazing chapter. ✨"
  },
  {
    emoji: "🎵",
    title: "Birthday soundtrack",
    text: "Put on your favourite song, turn the volume up, and dance like nobody is watching. This week is all about YOU. 🎶💃"
  },
  {
    emoji: "🥂",
    title: "Cheers to Ana!",
    text: "Here's to another year of laughter, adventures, ridiculous memories and moments we'll never forget. Happy Birthday! 🥂💕"
  }
];

function enterBirthday() {
  document.getElementById("welcome").style.display = "none";
  document.getElementById("birthday").style.display = "flex";
  confetti();
}

function openBox(index) {
  const m = messages[index];
  document.getElementById("modalEmoji").textContent = m.emoji;
  document.getElementById("modalTitle").textContent = m.title;
  document.getElementById("modalText").textContent = m.text;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function closeOutside(event) {
  if (event.target.id === "modal") closeModal();
}

function confetti() {
  for (let i = 0; i < 90; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (2 + Math.random() * 3) + "s";
    c.style.animationDelay = Math.random() * 1.5 + "s";
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    c.style.background = ["#ff6b9a","#ffd166","#7bdff2","#b8f2a6","#c8a2ff","#ff9f68"][Math.floor(Math.random()*6)];
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}
</script>

</body>
</html>
